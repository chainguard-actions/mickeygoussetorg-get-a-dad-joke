name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert dad-joke output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.dad-joke }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$(echo "$ACTUAL" | tr -d '[:space:]')" ]; then
            echo "FAIL: expected a non-empty dad joke"
            exit 1
          fi
          echo "PASS"
